global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp:587'
  smtp_from: 'alerts@aidream.invalid'

route:
  receiver: warning
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: critical
      repeat_interval: 30m

receivers:
  - name: warning
    webhook_configs:
      - url: 'http://webhook:8080/alerts'
        send_resolved: true
  - name: critical
    email_configs:
      - to: 'ops@aidream.invalid'
        send_resolved: true
    webhook_configs:
      - url: 'http://webhook:8080/alerts'
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
