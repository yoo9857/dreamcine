name: aidream

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    ports: ['127.0.0.1:3001:3000']
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter:/var/lib/node_exporter:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-aidream}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-aidream}?sslmode=disable
    restart: unless-stopped

  redis-exporter:
    image: quay.io/oliver006/redis_exporter:v1.77.0
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
