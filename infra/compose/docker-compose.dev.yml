name: aidream-dev

services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidream}
      POSTGRES_USER: ${POSTGRES_USER:-aidream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidream-local-only}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine3.21
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aidream-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aidream-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aidream-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aidream-local-secret}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-aidream-originals}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS:-aidream-hls}
      S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-aidream-thumbs}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mc alias set local "$${MINIO_ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET_ORIGINALS}" "local/$${S3_BUCKET_HLS}" "local/$${S3_BUCKET_THUMBS}"
        mc anonymous set none "local/$${S3_BUCKET_ORIGINALS}"
        mc anonymous set download "local/$${S3_BUCKET_HLS}"
        mc anonymous set download "local/$${S3_BUCKET_THUMBS}"
    restart: 'no'

  cdn:
    image: caddy:2.10.2-alpine
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET_HLS: ${S3_BUCKET_HLS:-aidream-hls}
      S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-aidream-thumbs}
    ports:
      - '9002:9002'
    volumes:
      - ../caddy/Caddyfile.dev-cdn:/etc/caddy/Caddyfile:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:9002/health']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
