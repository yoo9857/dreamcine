services:
  caddy:
    logging: &t0-logging
      options:
        max-size: 20m
        max-file: '3'

  worker:
    cpus: 0.7
    mem_limit: 700m
    environment:
      WORKER_CONCURRENCY: 1
      CAPACITY_TIER: T0
    entrypoint: ['nice', '-n', '10', 'node', 'dist/index.js']
    logging:
      <<: *t0-logging

  scheduler:
    mem_limit: 200m
    environment:
      CAPACITY_TIER: T0
    logging:
      <<: *t0-logging

  postgres:
    command: >-
      postgres -c shared_buffers=128MB -c max_connections=20
      -c effective_cache_size=512MB -c work_mem=4MB
      -c maintenance_work_mem=64MB
    logging:
      <<: *t0-logging

  redis:
    command: >-
      redis-server --appendonly yes --maxmemory 96mb
      --maxmemory-policy volatile-lru
    logging:
      <<: *t0-logging

  web:
    mem_limit: 700m
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      CAPACITY_TIER: T0
    logging:
      <<: *t0-logging
