name: aidream

services:
  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CDN_BASE_URL: ${CDN_BASE_URL:?CDN_BASE_URL is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_BUCKET_HLS: ${S3_BUCKET_HLS:?S3_BUCKET_HLS is required}
      S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:?S3_BUCKET_THUMBS is required}
      BOOTSTRAP_MODE: ${BOOTSTRAP_MODE:-false}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/bootstrap:/srv/bootstrap:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    restart: unless-stopped
    logging: &production-logging
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE with an immutable tag is required}
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *production-logging

  # 워커·스케줄러는 `media` 프로파일에 둔다.
  #
  # `${WORKER_IMAGE:?...}` 는 **파일 전체 보간 시점**에 평가되므로, 어떤
  # 서비스를 올리든 변수가 없으면 compose 가 통째로 거부한다. `apps/worker` 는
  # T06 에서 생기므로 그때까지 web-only 배포까지 막히게 된다.
  #
  # 그래서 태그 강제는 `scripts/ops/deploy.sh` 로 옮겼다 — 프로파일을 켤 때만
  # 검사한다. 결정이 실제로 내려지는 자리에 두는 편이 정확하다.
  worker:
    profiles: ['media']
    image: ${WORKER_IMAGE:-}
    env_file:
      - ../../.env
    environment:
      PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    logging: *production-logging

  scheduler:
    profiles: ['media']
    image: ${WORKER_IMAGE:-}
    env_file:
      - ../../.env
    environment:
      PROCESS_ROLE: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    logging: *production-logging

  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidream}
      POSTGRES_USER: ${POSTGRES_USER:-aidream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *production-logging

  redis:
    image: redis:7.4.5-alpine3.21
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *production-logging

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  postgres-data:
  redis-data:
