<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b12" />
    <meta
      name="description"
      content="iLOG — 이야기가 스크린이 되는 시네마틱 플랫폼"
    />
    <title>iLOG — 이야기가 스크린이 되는 곳</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #090b12;
        color: #f7f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 18%, #6d28d940 0, transparent 34rem),
          radial-gradient(circle at 82% 76%, #dc262640 0, transparent 32rem),
          #090b12;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
        content: '';
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px;
      }

      .shell {
        width: min(960px, 100%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 64px;
        color: inherit;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid #ffffff24;
        border-radius: 11px;
        background: linear-gradient(145deg, #8b5cf6, #ef4444);
        box-shadow: 0 12px 36px #7c3aed55;
        font-size: 15px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #c4b5fd;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(48px, 9vw, 96px);
        line-height: 0.98;
        letter-spacing: -0.075em;
      }

      h1 span {
        color: transparent;
        background: linear-gradient(100deg, #c4b5fd 10%, #f9a8d4 48%, #fca5a5);
        background-clip: text;
      }

      .lead {
        max-width: 620px;
        margin: 30px 0 0;
        color: #b7b8c5;
        font-size: clamp(17px, 2.5vw, 21px);
        line-height: 1.7;
        word-break: keep-all;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        margin-top: 44px;
        padding: 13px 17px;
        border: 1px solid #ffffff18;
        border-radius: 999px;
        background: #ffffff0a;
        color: #d7d7df;
        font-size: 14px;
        backdrop-filter: blur(16px);
      }

      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a78bfa;
        box-shadow: 0 0 0 6px #a78bfa1f;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 88px;
        padding-top: 24px;
        border-top: 1px solid #ffffff12;
        color: #777986;
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .brand {
          margin-bottom: 48px;
        }

        footer {
          flex-direction: column;
          margin-top: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <a class="brand" href="/" aria-label="iLOG 홈">
          <span class="mark" aria-hidden="true">iL</span>
          iLOG
        </a>

        <p class="eyebrow">Original stories · cinematic moments</p>
        <h1>이야기가<br /><span>스크린이 되는 곳.</span></h1>
        <p class="lead">
          창작자의 상상이 관객의 다음 장면이 되는 새로운 시네마틱 플랫폼을
          준비하고 있습니다.
        </p>

        <div class="status" role="status">
          <span class="pulse" aria-hidden="true"></span>
          안전한 서비스 기반을 구축하고 있습니다
        </div>

        <footer>
          <span>© 2026 iLOG</span>
          <span>ilog.info</span>
        </footer>
      </div>
    </main>
  </body>
</html>
