name: gate

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CAPACITY_TIER: T0
  APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  POSTGRES_DB: aidream
  POSTGRES_USER: aidream
  POSTGRES_PASSWORD: aidream-local-only
  DATABASE_URL: postgresql://aidream:aidream-local-only@127.0.0.1:5432/aidream?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  AUTH_SECRET: gate-only-secret-value-32-characters-min
  MINIO_ROOT_USER: aidream-local
  MINIO_ROOT_PASSWORD: aidream-local-secret
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: aidream-local
  S3_SECRET_ACCESS_KEY: aidream-local-secret
  S3_BUCKET_ORIGINALS: aidream-originals
  S3_BUCKET_HLS: aidream-hls
  S3_BUCKET_THUMBS: aidream-thumbs
  CDN_BASE_URL: http://127.0.0.1:9000/aidream-hls
  NEXT_PUBLIC_CDN_BASE_URL: http://127.0.0.1:9000/aidream-hls
  WORKER_CONCURRENCY: 1
  LOG_LEVEL: warn

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Resolve pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm 9 는 의존성의 postinstall 을 기본 차단하므로 @prisma/client 가
      # 스스로 클라이언트를 만들지 못한다. 타입체크가 생성물을 필요로 하니
      # 명시적으로 만든다. (OBS-002)
      - name: Generate Prisma client
        run: pnpm prisma generate --schema prisma/schema.prisma

      # 로컬 개발 스택을 그대로 쓴다 (T01 산출물).
      # 운영과의 구조 차이는 MinIO <-> Object Storage 뿐이어야 한다.
      - name: Start dependencies
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml \
            up -d --wait postgres redis minio

      - name: Create object storage buckets
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml \
            run --rm minio-init

      - name: Apply database migrations
        run: pnpm prisma migrate deploy --schema prisma/schema.prisma

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # HARNESS.md §1 의 3층을 각각의 스텝으로 둔다. 워크플로 로그 다운로드는
      # 관리자 권한을 요구하므로, 어느 층이 깨졌는지는 스텝 이름으로 드러나야 한다.
      - name: Gate L1 static
        run: pnpm gate:static

      - name: Gate L2 contract
        run: pnpm gate:contract

      - name: Gate L3 behaviour
        run: pnpm gate:test

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml logs --tail 200

      # 워크플로 로그 다운로드는 관리자 권한을 요구한다. 실패 근거를 누구나
      # 볼 수 있도록 리포트를 아티팩트로 남긴다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore
