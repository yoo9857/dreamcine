name: gate

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CAPACITY_TIER: T0
  APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  POSTGRES_DB: aidream
  POSTGRES_USER: aidream
  POSTGRES_PASSWORD: aidream-local-only
  DATABASE_URL: postgresql://aidream:aidream-local-only@127.0.0.1:5432/aidream?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  AUTH_SECRET: gate-only-secret-value-32-characters-min
  MINIO_ROOT_USER: aidream-local
  MINIO_ROOT_PASSWORD: aidream-local-secret
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: aidream-local
  S3_SECRET_ACCESS_KEY: aidream-local-secret
  S3_BUCKET_ORIGINALS: aidream-originals
  S3_BUCKET_HLS: aidream-hls
  S3_BUCKET_THUMBS: aidream-thumbs
  CDN_BASE_URL: http://127.0.0.1:9002
  NEXT_PUBLIC_CDN_BASE_URL: http://127.0.0.1:9002
  WORKER_CONCURRENCY: 1
  LOG_LEVEL: warn

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Resolve pnpm store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm 9 는 의존성의 postinstall 을 기본 차단하므로 @prisma/client 가
      # 스스로 클라이언트를 만들지 못한다. 타입체크가 생성물을 필요로 하니
      # 명시적으로 만든다. (OBS-002)
      - name: Generate Prisma client
        run: pnpm prisma generate --schema prisma/schema.prisma

      # 로컬 개발 스택을 그대로 쓴다 (T01 산출물).
      # 운영과의 구조 차이는 MinIO <-> Object Storage 뿐이어야 한다.
      - name: Start dependencies
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml \
            up -d --wait postgres redis minio cdn

      - name: Create object storage buckets
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml \
            run --rm minio-init

      - name: Apply database migrations
        run: pnpm prisma migrate deploy --schema prisma/schema.prisma

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # T06 은 실제 ffmpeg/ffprobe 프로세스를 띄워 HLS·썸네일 산출물을
      # 검증한다. GitHub ubuntu-24.04 이미지에는 바이너리가 기본 제공되지
      # 않으므로 통합 테스트 전에 명시적으로 설치한다.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      # E2E 는 프로덕션 빌드를 대상으로 한다(dev 서버는 React Refresh 때문에
      # CSP 의 unsafe-eval 을 요구한다). 빌드를 Playwright webServer 안에서
      # 돌리면 실패가 "webServer timeout" 으로만 보이므로 스텝을 분리한다.
      - name: Build web app
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @aidream/web build 2>&1 | tee build.log; then
            MSG=$(tail -c 1200 build.log | tr -s '[:space:]' ' ')
            echo "::error title=Build web app::${MSG}"
            exit 1
          fi

      # E2E 는 프로덕션이 실제로 실행하는 것을 띄운다 — standalone 서버다.
      # 복사 순서와 대상은 infra/docker/web.Dockerfile 의 runner 스테이지와
      # 같아야 한다. 여기서 갈라지면 검증한 것과 배포한 것이 달라진다. (OBS-010)
      - name: Prepare standalone server
        shell: bash
        run: |
          set -euo pipefail
          root=apps/web/.next/standalone/apps/web
          test -f "${root}/server.js"
          cp -r apps/web/.next/static "${root}/.next/static"
          cp -r apps/web/public "${root}/public"

      # 10_NFR §1 초기 JS 예산 · 08_UIUX §8 hls.js 초기 번들 금지.
      # 빌드 산출물이 있어야 재므로 빌드 직후에 둔다.
      - name: Bundle budget
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm perf:bundle 2>&1 | tee bundle.log; then
            MSG=$(tail -c 1200 bundle.log | tr -s '[:space:]' ' ')
            echo "::error title=Bundle budget::${MSG}"
            exit 1
          fi

      # HARNESS.md §1 의 3층을 각각의 스텝으로 둔다. 워크플로 로그 다운로드는
      # 관리자 권한을 요구하므로, 어느 층이 깨졌는지는 스텝 이름으로 드러나야 한다.
      - name: Gate L1 static
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm gate:static 2>&1 | tee gate-l1.log; then
            MSG=$(tail -c 1200 gate-l1.log | tr -s '[:space:]' ' ')
            echo "::error title=Gate L1 static::${MSG}"
            exit 1
          fi

      - name: Gate L2 contract
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm gate:contract 2>&1 | tee gate-l2.log; then
            MSG=$(tail -c 1200 gate-l2.log | tr -s '[:space:]' ' ')
            echo "::error title=Gate L2 contract::${MSG}"
            exit 1
          fi

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/infra/monitoring:/etc/aidream:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/aidream/alerts.yml

      - name: Gate L3 behaviour
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm gate:test 2>&1 | tee gate-l3.log; then
            MSG=$(tail -c 1200 gate-l3.log | tr -s '[:space:]' ' ')
            echo "::error title=Gate L3 behaviour::${MSG}"
            exit 1
          fi

      - name: Lighthouse mobile budgets
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm perf:lighthouse 2>&1 | tee lighthouse.log; then
            MSG=$(tail -c 1200 lighthouse.log | tr -s '[:space:]' ' ')
            echo "::error title=Lighthouse mobile budgets::${MSG}"
            exit 1
          fi

      - name: Collect dependency logs on failure
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml logs --tail 200

      # 워크플로 로그 다운로드는 관리자 권한을 요구한다. 실패 근거를 누구나
      # 볼 수 있도록 리포트를 아티팩트로 남긴다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gate-logs
          path: |
            build.log
            bundle.log
            gate-l1.log
            gate-l2.log
            gate-l3.log
            lighthouse.log
          retention-days: 7
          if-no-files-found: ignore

  # O01_DEPLOY.md §1 — "게이트 통과가 배포 조건". needs: gate 가 그 조건이다.
  # §1 — "이미지는 CI 가 빌드. 서버에서 소스 빌드 금지 (재현성 + 서버 자원 보호)"
  # §1 — "태그는 커밋 SHA. latest 금지"
  image:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # 직전 push 와 비교해 문서 전용 변경인지 판정한다.
          fetch-depth: 2

      - name: Detect deployable changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build=true

          # 비교 기준이 없거나 잘못되면 절대 생략하지 않는다.
          if [[ "${BEFORE_SHA}" != '0000000000000000000000000000000000000000' ]] && \
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            build=false
            while IFS= read -r file; do
              case "${file}" in
                docs/*|.github/*|README.md|*.md) ;;
                *)
                  build=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
          fi

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          if [[ "${build}" == 'false' ]]; then
            echo '::notice title=Images skipped::문서·CI 설정 전용 변경이라 웹·워커 이미지 게시를 생략합니다.'
          fi

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4.3.0

      # 워커는 T06 에서 생긴다. 그때까지 이 스텝은 스스로 건너뛴다 —
      # 사람이 워크플로를 고쳐야 켜지는 구조로 두면 켜는 것을 잊는다.
      - name: Detect worker source
        if: steps.changes.outputs.build == 'true'
        id: worker
        run: |
          if [ -f apps/worker/package.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Worker image skipped::apps/worker 가 아직 없습니다 (T06). 워커 이미지를 건너뜁니다.'
          fi

      - name: Build and push web image
        if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          # latest 를 붙이지 않는다. 롤백은 태그 교체로 하며,
          # latest 가 있으면 "지금 무엇이 돌고 있는지" 를 말할 수 없게 된다.
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        if: steps.changes.outputs.build == 'true' && steps.worker.outputs.present == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report images
        if: steps.changes.outputs.build == 'true'
        run: |
          {
            echo '### 배포 가능한 이미지'
            echo
            echo '```'
            echo "WEB_IMAGE=ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
            if [ '${{ steps.worker.outputs.present }}' = 'true' ]; then
              echo "WORKER_IMAGE=ghcr.io/${{ github.repository }}/worker:${{ github.sha }}"
            else
              echo '# WORKER_IMAGE — apps/worker 가 아직 없습니다 (T06)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report skipped images
        if: steps.changes.outputs.build == 'false'
        run: |
          {
            echo '### 컨테이너 이미지 생략'
            echo
            echo '문서·CI 설정 전용 변경이라 런타임 이미지에는 영향이 없습니다.'
          } >> "$GITHUB_STEP_SUMMARY"
